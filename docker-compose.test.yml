name: bank-test

services:
  nextjs:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      - backend-test

  backend-test:
    build:
      context: ./backend
    environment:
      DB_HOST: db-test
      DB_PORT: 3306
      DB_USER: bank_app
      DB_PASSWORD: bank_password
      DB_NAME: bank
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db-test:
        condition: service_healthy
    ports:
      - '3001:3001'

  db-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bank
      MYSQL_USER: bank_app
      MYSQL_PASSWORD: bank_password
    ports:
      - '3308:3306'
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./database/init-test.sql:/docker-entrypoint-initdb.d/init-test.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
